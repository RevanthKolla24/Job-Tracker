<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Job Tracker</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }
        .verify-container {
            max-width: 450px;
            width: 90%;
            padding: 40px 20px;
        }
    </style>
</head>
<body>

    <div class="card form-card text-center verify-container">
        <h1 id="verify-title" style="margin-top:0; font-weight: 900; text-transform: uppercase;">Verifying...</h1>
        <p id="verify-message" style="font-size: 1.1rem; font-weight: 600; margin-bottom: 30px;">
            Please wait a moment while we confirm your email address.
        </p>
        
        <a href="index.html" id="return-btn" class="btn-primary" style="display: none; text-decoration: none;">
            Go to Dashboard
        </a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script type="module" src="verify.js"></script>

</body>
</html>
